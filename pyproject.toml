[project]
name = "enterprise-ai"
version = "0.1.0"
description = "AI Internal Company Assistant"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.40.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.0",
    "langchain-text-splitters>=0.3.0",
    "httpx>=0.27.0",
    "mcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
eval = [
    "deepeval>=4.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
